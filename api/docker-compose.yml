version: "3.9"

services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./api:/var/www
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
      - gui
    networks:
      - appnet

  api:
    build:
      context: ./api
    container_name: laravel_api
    restart: always
    working_dir: /var/www
    user: "www-data"
    volumes:
      - ./api:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - appnet

  gui:
    build:
      context: ./gui
    container_name: react_gui
    restart: always
    networks:
      - appnet

  db:
    image: mariadb:11
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: InmobilApDB
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - appnet

volumes:
  mariadb_data:

networks:
  appnet:
